<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img"><rect x="0" y="0" width="900" height="460" rx="10" fill="#ffffff" stroke="#d7e6ee"/><text x="40" y="48" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="25" fill="#183a56">Experimental evidence vs. publication claims</text><text x="40" y="80" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="14" fill="#54758b">The research publication will distinguish what has actually been observed from what is not yet proven.</text><rect x="39" y="112" width="810" height="62" rx="10" fill="#e7f4f2" stroke="#d7e6ee"/><text x="57" y="137" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="15" fill="#183a56">LIVE OBSERVATION</text><text x="294" y="136" font-family="Arial,Helvetica,sans-serif" font-weight="600" font-size="14" fill="#183a56">Synthetic private-credit-like tasks</text><text x="294" y="156" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="12" fill="#577080">Real model responses have been recorded</text><rect x="39" y="186" width="810" height="62" rx="10" fill="#ecf4fa" stroke="#d7e6ee"/><text x="57" y="211" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="15" fill="#183a56">DOCUMENTED FAILURE</text><text x="294" y="210" font-family="Arial,Helvetica,sans-serif" font-weight="600" font-size="14" fill="#183a56">Error classes and unsafe outputs</text><text x="294" y="230" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="12" fill="#577080">Negative findings retained privately</text><rect x="39" y="260" width="810" height="62" rx="10" fill="#e7f4f2" stroke="#d7e6ee"/><text x="57" y="285" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="15" fill="#183a56">PUBLIC EXPLANATION</text><text x="294" y="284" font-family="Arial,Helvetica,sans-serif" font-weight="600" font-size="14" fill="#183a56">High-level, non-sensitive learnings</text><text x="294